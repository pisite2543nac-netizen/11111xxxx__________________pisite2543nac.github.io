<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js" defer></script></head><body><div class="wrap"><nav class="nav"><div class="brand">หน้า Admin</div><div class="links"><a class="btn secondary" href="index.html">หน้าหลัก</a><button id="logoutBtn" class="secondary hidden">ออกจากระบบ</button></div></nav><div id="setupNotice" class="notice"></div><section id="loginCard" class="card" style="max-width:430px;margin:35px auto"><h2>เข้าสู่ระบบผู้ดูแล</h2><form id="loginForm"><div class="field"><label>อีเมล</label><input name="email" type="email" required></div><div class="field"><label>รหัสผ่าน</label><input name="password" type="password" required></div><button>เข้าสู่ระบบ</button><div id="loginNotice" class="notice"></div></form></section><main id="panel" class="hidden"><section class="card"><h2>เพิ่มข้อมูลนักศึกษา</h2><form id="addForm" class="grid"><div class="field"><label>ชื่อ</label><input name="name" maxlength="150" required></div><div class="field"><label>ชั้น</label><select name="level" required><option value="ปวช">ปวช</option><option value="ปวส">ปวส</option></select></div><div class="field"><label>เลขท้ายนักศึกษา</label><input name="student_id" pattern="[0-9]{2,20}" required></div><div class="field"><label>คะแนน</label><input name="score" type="number" min="0" max="100" value="0" required></div><div class="actions"><button>เพิ่มข้อมูล</button><button type="button" id="exportBtn" class="secondary">ดาวน์โหลด CSV</button></div></form><div id="panelNotice" class="notice"></div></section><section class="card" style="margin-top:18px"><h2>รายชื่อนักศึกษา</h2><div class="table-wrap"><table><thead><tr><th>ชื่อ</th><th>ชั้น</th><th>เลขท้าย</th><th>คะแนน</th><th>จัดการ</th></tr></thead><tbody id="tbody"></tbody></table></div></section></main></div><script>
let students = [];
window.addEventListener('DOMContentLoaded', async () => {
  if (!window.isConfigured) { showNotice(setupNotice, 'ยังไม่ได้ตั้งค่า Supabase กรุณาแก้ไขไฟล์ config.js'); loginForm.querySelector('button').disabled = true; return; }
  const { data: { session } } = await db.auth.getSession();
  if (session) await openPanel();
  loginForm.onsubmit = async e => { e.preventDefault(); const v = Object.fromEntries(new FormData(e.target)); const { error } = await db.auth.signInWithPassword(v); if (error) return showNotice(loginNotice, 'เข้าสู่ระบบไม่สำเร็จ: ' + error.message); await openPanel(); };
  logoutBtn.onclick = async () => { await db.auth.signOut(); location.reload(); };
  addForm.onsubmit = async e => { e.preventDefault(); const body = Object.fromEntries(new FormData(e.target)); body.score = Number(body.score); const { error } = await db.from('students').insert(body); showNotice(panelNotice, error ? error.message : 'เพิ่มข้อมูลสำเร็จ', !error); if (!error) { e.target.reset(); await loadStudents(); } };
  exportBtn.onclick = exportCsv;
});
async function openPanel(){
  const { data, error } = await db.rpc('current_user_is_admin');
  if (error || !data) { await db.auth.signOut(); return showNotice(loginNotice, 'บัญชีนี้ไม่มีสิทธิ์ Admin'); }
  loginCard.classList.add('hidden'); panel.classList.remove('hidden'); logoutBtn.classList.remove('hidden'); await loadStudents();
}
async function loadStudents(){
  const { data, error } = await db.from('students').select('*').order('created_at', { ascending:false });
  if (error) { showNotice(panelNotice, error.message); return; }
  students = data || [];
  tbody.innerHTML = students.map(s => `<tr><td><input id="n${s.id}" value="${escapeHtml(s.name)}"></td><td><select id="l${s.id}"><option ${s.level==='ปวช'?'selected':''}>ปวช</option><option ${s.level==='ปวส'?'selected':''}>ปวส</option></select></td><td><input id="i${s.id}" value="${escapeHtml(s.student_id)}"></td><td><input id="s${s.id}" type="number" min="0" max="100" value="${s.score}"></td><td><div class="actions"><button class="small" onclick="saveRow('${s.id}')">บันทึก</button><button class="small secondary" onclick="changeScore('${s.id}',-1)">-1</button><button class="small secondary" onclick="changeScore('${s.id}',1)">+1</button><button class="small danger" onclick="deleteRow('${s.id}')">ลบ</button></div></td></tr>`).join('') || '<tr><td colspan="5" class="muted">ยังไม่มีข้อมูล</td></tr>';
}
async function saveRow(id){ const body={name:document.getElementById('n'+id).value.trim(),level:document.getElementById('l'+id).value,student_id:document.getElementById('i'+id).value.trim(),score:Number(document.getElementById('s'+id).value)}; const {error}=await db.from('students').update(body).eq('id',id); showNotice(panelNotice,error?error.message:'บันทึกสำเร็จ',!error); if(!error) await loadStudents(); }
async function changeScore(id,delta){ const el=document.getElementById('s'+id); el.value=Math.max(0,Math.min(100,Number(el.value||0)+delta)); await saveRow(id); }
async function deleteRow(id){ if(!confirm('ยืนยันการลบข้อมูล?'))return; const {error}=await db.from('students').delete().eq('id',id); showNotice(panelNotice,error?error.message:'ลบข้อมูลสำเร็จ',!error); if(!error) await loadStudents(); }
function exportCsv(){ const rows=[['ชื่อ','ชั้น','เลขท้ายนักศึกษา','คะแนน'],...students.map(s=>[s.name,s.level,s.student_id,s.score])]; const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='students.csv'; a.click(); URL.revokeObjectURL(a.href); }
</script></body></html>
