<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User - ลงทะเบียน</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js" defer></script></head><body><div class="wrap"><nav class="nav"><div class="brand">หน้า User</div><div class="links"><a class="btn secondary" href="index.html">หน้าหลัก</a><a class="btn secondary" href="admin.html">Admin</a></div></nav><div id="setupNotice" class="notice"></div><main class="grid"><section class="card"><h2>ลงทะเบียนนักศึกษา</h2><form id="registerForm"><div class="field"><label>ชื่อ-นามสกุล</label><input name="p_name" maxlength="150" required></div><div class="field"><label>ชั้น</label><select name="p_level" required><option value="">-- เลือก --</option><option value="ปวช">ปวช</option><option value="ปวส">ปวส</option></select></div><div class="field"><label>เลขท้ายนักศึกษา</label><input name="p_student_id" inputmode="numeric" pattern="[0-9]{2,20}" maxlength="20" required></div><button type="submit">บันทึกการลงทะเบียน</button><div id="regNotice" class="notice"></div></form></section><section class="card"><h2>ตรวจสอบคะแนน</h2><form id="scoreForm"><div class="field"><label>ชั้น</label><select name="p_level" required><option value="">-- เลือก --</option><option value="ปวช">ปวช</option><option value="ปวส">ปวส</option></select></div><div class="field"><label>เลขท้ายนักศึกษา</label><input name="p_student_id" inputmode="numeric" pattern="[0-9]{2,20}" required></div><button type="submit">ค้นหาคะแนน</button></form><div id="scoreNotice" class="notice"></div><div id="result" class="hidden"><p id="studentName"></p><div class="score"><span id="scoreValue">0</span>/100</div></div></section></main></div><script>
window.addEventListener('DOMContentLoaded', () => {
  if (!window.isConfigured) {
    showNotice(setupNotice, 'ยังไม่ได้ตั้งค่า Supabase กรุณาแก้ไขไฟล์ config.js');
    document.querySelectorAll('button').forEach(b => b.disabled = true);
    return;
  }
  registerForm.onsubmit = async e => {
    e.preventDefault();
    const payload = Object.fromEntries(new FormData(e.target));
    const { data, error } = await db.rpc('register_student', payload);
    if (error) return showNotice(regNotice, error.message);
    showNotice(regNotice, data?.message || 'ลงทะเบียนสำเร็จ', true);
    e.target.reset();
  };
  scoreForm.onsubmit = async e => {
    e.preventDefault(); result.classList.add('hidden');
    const payload = Object.fromEntries(new FormData(e.target));
    const { data, error } = await db.rpc('lookup_student_score', payload);
    if (error) return showNotice(scoreNotice, error.message);
    if (!data || data.length === 0) return showNotice(scoreNotice, 'ไม่พบข้อมูลนักศึกษา');
    scoreNotice.className = 'notice';
    const s = data[0]; studentName.textContent = `${s.name} · ${s.level} · ${s.student_id}`;
    scoreValue.textContent = s.score; result.classList.remove('hidden');
  };
});
</script></body></html>
